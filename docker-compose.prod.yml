# Chorus Messenger — Production Docker Compose for Dokploy
# Usage: Deploy this via Dokploy dashboard or CLI.
# Dokploy handles:
#   - SSL/TLS via Let's Encrypt (Traefik)
#   - Domain routing (chorus.talk → frontend:3000)
#   - Internal networking between containers

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: chorus-postgres
    environment:
      POSTGRES_DB: messenger_prod
      POSTGRES_USER: messenger
      # Hardcoded (same value as DATABASE_URL below) so the deployment has zero
      # dependence on Dokploy env vars. The entrypoint re-syncs the DB user's
      # password to this value on every start.
      POSTGRES_PASSWORD: ChorusProd2026
    ports:
      # Expose only if you need external DB access (remove in production)
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # Re-syncs the app user's password to POSTGRES_PASSWORD at every container
      # start. The official image only honors POSTGRES_PASSWORD on an empty
      # volume, so redeploys against an existing volume would otherwise get a
      # "password authentication failed for user messenger" in the backend.
      # Requires LF line endings (use `dos2unix deploy/postgres/entrypoint.sh`).
      - ./deploy/postgres/entrypoint.sh:/entrypoint.sh:ro
    entrypoint: ["/bin/sh", "/entrypoint.sh"]
    healthcheck:
      # -d prevents `pg_isready` from probing a database named after the user,
      # which produced repeated `database "messenger" does not exist` FATALs.
      test: ["CMD-SHELL", "pg_isready -U messenger -d messenger_prod"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: always
    networks:
      - chorus-network

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: chorus-redis
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: always
    networks:
      - chorus-network

  # Go Backend API — stateless, horizontally scalable behind the L4 LB
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    # container_name removed so --scale backend=N can create multiple replicas
    expose:
      - "8080"
    # No host port — LB fronts it; scale with: docker compose up --scale backend=3 -d
    deploy:
      replicas: 2
      restart_policy:
        condition: on-failure
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/health | grep -q healthy || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 15s
    environment:
      - SERVER_ID=${HOSTNAME:-backend}
      - ENVIRONMENT=production
      - DATABASE_URL=postgres://messenger:ChorusProd2026@postgres:5432/messenger_prod?sslmode=disable
      - REDIS_URL=redis:6379
      - JWT_SECRET=${JWT_SECRET}
      # Provider chain (canonical schema) — first successful provider wins,
      # cloud quotas/rate limits are skipped automatically, local always last.
      # Provider type is derived from the provider name, so chain aliases are
      # the canonical names (openrouter, nvidia, opencode, ollama, ...).
      - TRANSLATION_FALLBACK_ORDER=openrouter,libretranslate,nvidia,opencode
      - GRAMMAR_FALLBACK_ORDER=openrouter,nvidia,opencode
      - TRANSLATION_CHAIN_TIMEOUT=${TRANSLATION_CHAIN_TIMEOUT:-120}
      - PROVIDER_LIBRETRANSLATE_URL=http://libretranslate:5000
      - PROVIDER_LIBRETRANSLATE_TIMEOUT=60
      # OpenRouter (primary LLM): translation uses a fast cheap model, grammar
      # uses a stronger JSON-capable model.
      - PROVIDER_OPENROUTER_URL=https://openrouter.ai/api/v1
      - PROVIDER_OPENROUTER_KEY=${PROVIDER_OPENROUTER_KEY:-}
      - PROVIDER_OPENROUTER_TIMEOUT=60
      - MODEL_TRANSLATION_OPENROUTER=${MODEL_TRANSLATION_OPENROUTER:-meta-llama/llama-3.1-8b-instruct}
      - MODEL_GRAMMAR_OPENROUTER=${MODEL_GRAMMAR_OPENROUTER:-google/gemini-2.5-flash}
      - PROVIDER_NVIDIA_URL=${PROVIDER_NVIDIA_URL:-https://integrate.api.nvidia.com/v1}
      - PROVIDER_NVIDIA_KEY=${PROVIDER_NVIDIA_KEY:-}
      - MODEL_TRANSLATION_NVIDIA=${MODEL_TRANSLATION_NVIDIA:-meta/llama-3.1-70b-instruct}
      - MODEL_GRAMMAR_NVIDIA=${MODEL_GRAMMAR_NVIDIA:-meta/llama-3.1-8b-instruct}
      - PROVIDER_OPENCODE_URL=${PROVIDER_OPENCODE_URL:-https://opencode.ai/zen/go/v1}
      - PROVIDER_OPENCODE_KEY=${PROVIDER_OPENCODE_KEY:-}
      - MODEL_TRANSLATION_OPENCODE=${MODEL_TRANSLATION_OPENCODE:-deepseek-v4-flash}
      - MODEL_GRAMMAR_OPENCODE=${MODEL_GRAMMAR_OPENCODE:-deepseek-v4-flash}
      - PORT=8080
      # Waitlist / invite-only registration (REQUIRED for /admin/waitlist).
      # WAITLIST_ADMIN_EMAILS is a comma-separated allowlist of admin emails.
      - WAITLIST_ADMIN_EMAILS=${WAITLIST_ADMIN_EMAILS:-}
      - INVITE_BASE_URL=${INVITE_BASE_URL:-https://chorus.talk/register}
      - INVITE_TTL_HOURS=${INVITE_TTL_HOURS:-168}
      # Mailu SMTP — used to send waitlist confirmations and invites.
      - MAILU_SMTP_HOST=${MAILU_SMTP_HOST:-}
      - MAILU_SMTP_PORT=${MAILU_SMTP_PORT:-465}
      - MAILU_SMTP_USERNAME=${MAILU_SMTP_USERNAME:-}
      - MAILU_SMTP_PASSWORD=${MAILU_SMTP_PASSWORD:-}
      - MAILU_SMTP_FROM=${MAILU_SMTP_FROM:-}
      # Task 6.6 file/document sharing: where uploads are stored + served from.
      - UPLOAD_DIR=/root/uploads
      - MEDIA_BASE_URL=/media
      - MAX_UPLOAD_MB=${MAX_UPLOAD_MB:-50}
    volumes:
      - uploads_data:/root/uploads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      libretranslate:
        condition: service_healthy
    restart: always
    networks:
      - chorus-network

  # Layer 4 load balancer (TCP, leastconn) fronting the stateless backends
  lb:
    image: haproxy:2.8-alpine
    container_name: chorus-lb
    volumes:
      - ./deploy/lb/haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro
    expose:
      - "8080"
      - "8404"
    ports:
      - "127.0.0.1:8404:8404"
    environment:
      - LB_ALGORITHM=${LB_ALGORITHM:-leastconn}
      - LB_MAXCONN_PER_SERVER=${LB_MAXCONN_PER_SERVER:-1000}
      - LB_HEALTHCHECK_INTERVAL=${LB_HEALTHCHECK_INTERVAL:-5s}
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "haproxy -c -f /usr/local/etc/haproxy/haproxy.cfg && echo ok | nc 127.0.0.1 8404 | grep -q stats || wget -qO- http://127.0.0.1:8404/stats | grep -q stats"]
      interval: 10s
      timeout: 3s
      retries: 3
    restart: always
    networks:
      - chorus-network

  # React Frontend (served via Nginx) — proxies /api,/ws,/media via the L4 LB
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - NGINX_CONFIG=nginx.prod.conf
    container_name: chorus-frontend
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.chorus.rule=Host(`chorus.talk`)"
      - "traefik.http.routers.chorus.entrypoints=websecure"
      - "traefik.http.routers.chorus.tls=true"
      - "traefik.http.routers.chorus.tls.certresolver=letsencrypt"
      - "traefik.http.services.chorus.loadbalancer.server.port=3000"
      - "traefik.http.services.chorus.loadbalancer.server.scheme=http"
    expose:
      - "3000"
    # Dokploy/Traefik handles external access
    depends_on:
      lb:
        condition: service_healthy
    restart: always
    networks:
      - chorus-network
      - dokploy-network

  # ============================================================================
  # LibreTranslate — fast local translation (Argos/OPUS-MT backend), CPU-only,
  # ~20-30ms warm for chat-sized messages. First provider in the translation
  # chain and the memory-efficient offline fallback. LT_LOAD_ONLY limits
  # first-boot model downloads to the top-10 world languages.
  # Docs: https://github.com/LibreTranslate/LibreTranslate
  # ============================================================================
  libretranslate:
    image: libretranslate/libretranslate:latest
    container_name: chorus-libretranslate
    networks:
      - chorus-network
    ports:
      - "127.0.0.1:5000:5000"
    volumes:
      - libretranslate_data:/app/.local/share/argos-translate
    environment:
      # Top-10 world languages by speaker count:
      #   en English · zh Mandarin · hi Hindi · es Spanish · ar Arabic
      #   fr French · bn Bengali · pt Portuguese · ru Russian · ur Urdu
      # Extend this list as needed; each new pair downloads an Argos model once.
      - LT_LOAD_ONLY=en,zh,hi,es,ar,fr,bn,pt,ru,ur
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:5000/languages', timeout=5).status==200 else 1)"]
      interval: 20s
      timeout: 10s
      retries: 12
      start_period: 180s
    deploy:
      resources:
        limits:
          memory: 3g
          cpus: '2.0'
    restart: always

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  libretranslate_data:
    driver: local
  uploads_data:
    driver: local

networks:
  chorus-network:
    driver: bridge
  dokploy-network:
    external: true
