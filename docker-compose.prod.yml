# Chorus Messenger — Production Docker Compose for Dokploy
# Usage: Deploy this via Dokploy dashboard or CLI.
# Dokploy handles:
#   - SSL/TLS via Let's Encrypt (Traefik)
#   - Domain routing (chorus.talk → frontend:3000)
#   - Internal networking between containers

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: chorus-postgres
    environment:
      POSTGRES_DB: messenger_prod
      POSTGRES_USER: messenger
      POSTGRES_PASSWORD: ${DB_PASSWORD:-ChangeMe123}
    ports:
      # Expose only if you need external DB access (remove in production)
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U messenger"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: always
    networks:
      - chorus-network

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: chorus-redis
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: always
    networks:
      - chorus-network

  # Go Backend API
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: chorus-backend
    # No host port — Dokploy routes internally
    environment:
      - ENVIRONMENT=production
      - DATABASE_URL=postgres://messenger:${DB_PASSWORD:-ChangeMe123}@postgres:5432/messenger_prod?sslmode=disable
      - REDIS_URL=redis:6379
      - JWT_SECRET=${JWT_SECRET}
      - PORT=8080
      - LOG_LEVEL=${LOG_LEVEL:-info}

      # ─── Legacy single-provider translation (fallback) ───
      - TRANSLATION_PROVIDER_NAME=${TRANSLATION_PROVIDER_NAME:-opencode}
      - TRANSLATION_PROVIDER_API_URL=${TRANSLATION_PROVIDER_API_URL:-}
      - TRANSLATION_PROVIDER_API_KEY=${TRANSLATION_PROVIDER_API_KEY:-}
      - TRANSLATION_PROVIDER_MODEL=${TRANSLATION_PROVIDER_MODEL:-}

      # ─── External LLM provider chain (unified — used for BOTH translation and grammar) ───
      # nllb-local is FIRST: free, local, CPU-only NLLB-200 int8 translation.
      - EXTERNAL_LLM_PROVIDER_ORDER=${EXTERNAL_LLM_PROVIDER_ORDER:-nllb-local,ollama_local,nvidia,opencode_go}
      - TRANSLATION_CHAIN_TIMEOUT=${TRANSLATION_CHAIN_TIMEOUT:-300}
      - PROVIDER_NLLB_LOCAL_TYPE=${PROVIDER_NLLB_LOCAL_TYPE:-nllb-local}
      - PROVIDER_NLLB_LOCAL_API_URL=${PROVIDER_NLLB_LOCAL_API_URL:-http://nllb-local:5001}
      - PROVIDER_NLLB_LOCAL_MODEL=${PROVIDER_NLLB_LOCAL_MODEL:-nllb-200-distilled-600M-ct2-int8}
      - PROVIDER_NLLB_LOCAL_TIMEOUT=${PROVIDER_NLLB_LOCAL_TIMEOUT:-60}
      - PROVIDER_OPENCODE_GO_TYPE=${PROVIDER_OPENCODE_GO_TYPE:-}
      - PROVIDER_OPENCODE_GO_API_URL=${PROVIDER_OPENCODE_GO_API_URL:-}
      - PROVIDER_OPENCODE_GO_API_KEY=${PROVIDER_OPENCODE_GO_API_KEY:-}
      - PROVIDER_OPENCODE_GO_MODEL=${PROVIDER_OPENCODE_GO_MODEL:-}
      - PROVIDER_NVIDIA_TYPE=${PROVIDER_NVIDIA_TYPE:-}
      - PROVIDER_NVIDIA_API_URL=${PROVIDER_NVIDIA_API_URL:-}
      - PROVIDER_NVIDIA_API_KEY=${PROVIDER_NVIDIA_API_KEY:-}
      - PROVIDER_NVIDIA_MODEL=${PROVIDER_NVIDIA_MODEL:-}
      - PROVIDER_OLLAMA_LOCAL_TYPE=${PROVIDER_OLLAMA_LOCAL_TYPE:-}
      - PROVIDER_OLLAMA_LOCAL_API_URL=${PROVIDER_OLLAMA_LOCAL_API_URL:-}
      - PROVIDER_OLLAMA_LOCAL_MODEL=${PROVIDER_OLLAMA_LOCAL_MODEL:-}
      - PROVIDER_OLLAMA_LOCAL_TIMEOUT=${PROVIDER_OLLAMA_LOCAL_TIMEOUT:-}

      # ─── Appwrite ───
      - APPWRITE_ENDPOINT=${APPWRITE_ENDPOINT:-}
      - APPWRITE_PROJECT_ID=${APPWRITE_PROJECT_ID:-}
      - APPWRITE_API_KEY=${APPWRITE_API_KEY:-}
      - APPWRITE_DATABASE_ID=${APPWRITE_DATABASE_ID:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      nllb-local:
        condition: service_started
      translator-engine:
        condition: service_started
      ollama:
        condition: service_started
    restart: always
    networks:
      - chorus-network

  # React Frontend (served via Nginx)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - NGINX_CONFIG=nginx.prod.conf
        - VITE_APPWRITE_ENDPOINT=${VITE_APPWRITE_ENDPOINT:-}
        - VITE_APPWRITE_PROJECT_ID=${VITE_APPWRITE_PROJECT_ID:-}
        - VITE_APPWRITE_DATABASE_ID=${VITE_APPWRITE_DATABASE_ID:-}
        - VITE_APPWRITE_CLIENT_API_KEY=${VITE_APPWRITE_CLIENT_API_KEY:-}
    container_name: chorus-frontend
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.chorus.rule=Host(`chorus.talk`)"
      - "traefik.http.routers.chorus.entrypoints=websecure"
      - "traefik.http.routers.chorus.tls=true"
      - "traefik.http.routers.chorus.tls.certresolver=letsencrypt"
      - "traefik.http.services.chorus.loadbalancer.server.port=3000"
      - "traefik.http.services.chorus.loadbalancer.server.scheme=http"
    expose:
      - "3000"
    # Dokploy/Traefik handles external access
    depends_on:
      - backend
    restart: always
    networks:
      - chorus-network
      - dokploy-network

  # Ollama Translation Service (used for grammar, vocabulary, AI tutor)
  ollama:
    image: ollama/ollama:latest
    container_name: chorus-ollama
    networks:
      - chorus-network
    ports:
      - "127.0.0.1:11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    environment:
      - OLLAMA_KEEP_ALIVE=24h
    entrypoint: >
      sh -c "ollama serve &
      sleep 3 &&
      ollama pull qwen2.5:3b &&
      wait"
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s
    restart: always

  # ============================================================================
  # NLLB-200 CTranslate2 sidecar ("nllb-local")
  # Meta's NLLB-200 (distilled-600M) via the fast CTranslate2 int8 backend on
  # CPU only. First provider in the translation chain — free, local, no key.
  # Internal only (no host port): reached by the backend over chorus-network.
  # ============================================================================
  nllb-local:
    build:
      context: ./backend/nllb-serve
      dockerfile: Dockerfile.sidecar
    container_name: chorus-nllb-local
    networks:
      - chorus-network
    expose:
      - "5001"
    volumes:
      - nllb_models:/app/models
    environment:
      - NLLB_MODEL_DIR=/app/models/nllb_200_distilled_int8
      - NLLB_SOURCE_MODEL=facebook/nllb-200-distilled-600M
      - NLLB_INTER_THREADS=2
      - NLLB_INTRA_THREADS=2
      - NLLB_DEFAULT_SOURCE=eng_Latn
      - NLLB_DEFAULT_TARGET=spa_Latn
      - PORT=5001
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2G
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:5001/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: always

  # ============================================================================
  # Translator Engine (Phase 1 — replaces NLLB)
  # llama.cpp server with a 7B-param translation model in GGUF format.
  # Exposes an OpenAI-compatible API at /v1/chat/completions.
  # RAM limit: ~4.5 GB (fits a Q4_K_S 7B model comfortably).
  # ============================================================================
  translator-engine:
    build:
      context: ./backend/translator-engine
      dockerfile: Dockerfile
    container_name: chorus-translator-engine
    networks:
      - chorus-network
    ports:
      - "127.0.0.1:5001:5000"
    volumes:
      - translator_model_cache:/models
    environment:
      - HF_REPO=mradermacher/Synatra-7B-v0.3-Translation-GGUF
      - HF_FILE=Synatra-7B-v0.3-Translation.Q4_K_S.gguf
      - PORT=5000
      - CTX_SIZE=2048
      - THREADS=4
      - TEMPERATURE=0.1
    deploy:
      resources:
        limits:
          memory: 4.5G
        reservations:
          memory: 3.8G
    healthcheck:
      test: ["CMD", "curl", "-sSf", "http://localhost:5000/health"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 600s
    restart: always

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  ollama_data:
    driver: local
  translator_model_cache:
    driver: local
  nllb_models:
    driver: local

networks:
  chorus-network:
    driver: bridge
  dokploy-network:
    external: true