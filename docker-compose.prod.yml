# Chorus Messenger — Production Docker Compose for Dokploy
# Usage: Deploy this via Dokploy dashboard or CLI.
# Dokploy handles:
#   - SSL/TLS via Let's Encrypt (Traefik)
#   - Domain routing (chorus.talk → frontend:3000)
#   - Internal networking between containers

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: chorus-postgres
    environment:
      POSTGRES_DB: messenger_prod
      POSTGRES_USER: messenger
      POSTGRES_PASSWORD: ${DB_PASSWORD:-ChangeMe123}
    ports:
      # Expose only if you need external DB access (remove in production)
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U messenger"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: always
    networks:
      - chorus-network

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: chorus-redis
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: always
    networks:
      - chorus-network

  # Go Backend API
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: chorus-backend
    # No host port — Dokploy routes internally
    environment:
      - ENVIRONMENT=production
      - DATABASE_URL=postgres://messenger:${DB_PASSWORD:-ChangeMe123}@postgres:5432/messenger_prod?sslmode=disable
      - REDIS_URL=redis:6379
      - JWT_SECRET=${JWT_SECRET}
      - TRANSLATION_PROVIDER_NAME=${TRANSLATION_PROVIDER_NAME:-opencode}
      - TRANSLATION_PROVIDER_API_URL=${TRANSLATION_PROVIDER_API_URL:-}
      - TRANSLATION_PROVIDER_API_KEY=${TRANSLATION_PROVIDER_API_KEY:-}
      - TRANSLATION_PROVIDER_MODEL=${TRANSLATION_PROVIDER_MODEL:-}
      # Unified provider chain (recommended) — first successful provider wins,
      # cloud quotas/rate limits are skipped automatically, local always last.
      - TRANSLATION_PROVIDER_ORDER=${TRANSLATION_PROVIDER_ORDER:-libretranslate,openrouter,nvidia,opencode_go,ollama_local}
      - GRAMMAR_ANALYSIS_PROVIDER_ORDER=${GRAMMAR_ANALYSIS_PROVIDER_ORDER:-openrouter,nvidia,opencode_go,ollama_local}
      - TRANSLATION_CHAIN_TIMEOUT=${TRANSLATION_CHAIN_TIMEOUT:-120}
      - PROVIDER_LIBRETRANSLATE_TYPE=libretranslate
      - PROVIDER_LIBRETRANSLATE_API_URL=${PROVIDER_LIBRETRANSLATE_API_URL:-http://libretranslate:5000}
      - PROVIDER_LIBRETRANSLATE_TIMEOUT=${PROVIDER_LIBRETRANSLATE_TIMEOUT:-10}
      - PROVIDER_OPENROUTER_TYPE=openrouter
      - PROVIDER_OPENROUTER_API_URL=${PROVIDER_OPENROUTER_API_URL:-https://openrouter.ai}
      - PROVIDER_OPENROUTER_API_KEY=${PROVIDER_OPENROUTER_API_KEY:-}
      - PROVIDER_OPENROUTER_MODEL=${PROVIDER_OPENROUTER_MODEL:-google/gemini-2.5-flash-lite:free}
      - PROVIDER_NVIDIA_TYPE=nvidia
      - PROVIDER_NVIDIA_API_URL=${PROVIDER_NVIDIA_API_URL:-https://integrate.api.nvidia.com/v1}
      - PROVIDER_NVIDIA_API_KEY=${PROVIDER_NVIDIA_API_KEY:-}
      - PROVIDER_NVIDIA_MODEL=${PROVIDER_NVIDIA_MODEL:-meta/llama-3.1-70b-instruct}
      - PROVIDER_OPENCODE_GO_TYPE=opencode
      - PROVIDER_OPENCODE_GO_API_URL=${PROVIDER_OPENCODE_GO_API_URL:-https://opencode.ai/zen/go/v1}
      - PROVIDER_OPENCODE_GO_API_KEY=${PROVIDER_OPENCODE_GO_API_KEY:-}
      - PROVIDER_OPENCODE_GO_MODEL=${PROVIDER_OPENCODE_GO_MODEL:-deepseek-v4-flash}
      - PROVIDER_OLLAMA_LOCAL_TYPE=ollama
      - PROVIDER_OLLAMA_LOCAL_API_URL=${PROVIDER_OLLAMA_LOCAL_API_URL:-http://ollama:11434}
      - PROVIDER_OLLAMA_LOCAL_MODEL=${PROVIDER_OLLAMA_LOCAL_MODEL:-qwen2.5:3b}
      - PROVIDER_OLLAMA_LOCAL_TIMEOUT=${PROVIDER_OLLAMA_LOCAL_TIMEOUT:-600}
      - PORT=8080
      - APPWRITE_ENDPOINT=${APPWRITE_ENDPOINT:-}
      - APPWRITE_PROJECT_ID=${APPWRITE_PROJECT_ID:-}
      - APPWRITE_API_KEY=${APPWRITE_API_KEY:-}
      - APPWRITE_DATABASE_ID=${APPWRITE_DATABASE_ID:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      translator-engine:
        condition: service_started
      ollama:
        condition: service_started
      libretranslate:
        condition: service_healthy
    restart: always
    networks:
      - chorus-network

  # React Frontend (served via Nginx)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - NGINX_CONFIG=nginx.prod.conf
        - VITE_APPWRITE_ENDPOINT=${VITE_APPWRITE_ENDPOINT:-}
        - VITE_APPWRITE_PROJECT_ID=${VITE_APPWRITE_PROJECT_ID:-}
        - VITE_APPWRITE_DATABASE_ID=${VITE_APPWRITE_DATABASE_ID:-}
        - VITE_APPWRITE_CLIENT_API_KEY=${VITE_APPWRITE_CLIENT_API_KEY:-}
    container_name: chorus-frontend
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.chorus.rule=Host(`chorus.talk`)"
      - "traefik.http.routers.chorus.entrypoints=websecure"
      - "traefik.http.routers.chorus.tls=true"
      - "traefik.http.routers.chorus.tls.certresolver=letsencrypt"
      - "traefik.http.services.chorus.loadbalancer.server.port=3000"
      - "traefik.http.services.chorus.loadbalancer.server.scheme=http"
    expose:
      - "3000"
    # Dokploy/Traefik handles external access
    depends_on:
      - backend
    restart: always
    networks:
      - chorus-network
      - dokploy-network

  # Ollama Translation Service (used for grammar, vocabulary, AI tutor)
  ollama:
    image: ollama/ollama:latest
    container_name: chorus-ollama
    networks:
      - chorus-network
    ports:
      - "127.0.0.1:11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    environment:
      - OLLAMA_KEEP_ALIVE=24h
    entrypoint: >
      sh -c "ollama serve &
      sleep 3 &&
      ollama pull qwen2.5:3b &&
      wait"
    healthcheck:
      test: ["CMD", "ollama", "show", "qwen2.5:3b"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 120s
    restart: always

  # ============================================================================
  # LibreTranslate — fast local translation (Argos/OPUS-MT backend), CPU-only,
  # ~20-30ms warm for chat-sized messages. First provider in the translation
  # chain and the memory-efficient offline fallback. LT_LOAD_ONLY limits
  # first-boot model downloads to the top-10 world languages.
  # Docs: https://github.com/LibreTranslate/LibreTranslate
  # ============================================================================
  libretranslate:
    image: libretranslate/libretranslate:latest
    container_name: chorus-libretranslate
    networks:
      - chorus-network
    ports:
      - "127.0.0.1:5000:5000"
    volumes:
      - libretranslate_data:/app/.local/share/argos-translate
    environment:
      # Top-10 world languages by speaker count:
      #   en English · zh Mandarin · hi Hindi · es Spanish · ar Arabic
      #   fr French · bn Bengali · pt Portuguese · ru Russian · ur Urdu
      # Extend this list as needed; each new pair downloads an Argos model once.
      - LT_LOAD_ONLY=en,zh,hi,es,ar,fr,bn,pt,ru,ur
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:5000/languages', timeout=5).status==200 else 1)"]
      interval: 20s
      timeout: 10s
      retries: 12
      start_period: 180s
    deploy:
      resources:
        limits:
          memory: 2g
          cpus: '1.0'
    restart: always

  # ============================================================================
  # Translator Engine (Phase 1 — replaces NLLB)
  # llama.cpp server with a 7B-param translation model in GGUF format.
  # Exposes an OpenAI-compatible API at /v1/chat/completions.
  # RAM limit: ~4.5 GB (fits a Q4_K_S 7B model comfortably).
  # ============================================================================
  translator-engine:
    build:
      context: ./backend/translator-engine
      dockerfile: Dockerfile
    container_name: chorus-translator-engine
    networks:
      - chorus-network
    ports:
      - "127.0.0.1:5001:5000"
    volumes:
      - translator_model_cache:/models
    environment:
      - HF_REPO=mradermacher/Synatra-7B-v0.3-Translation-GGUF
      - HF_FILE=Synatra-7B-v0.3-Translation.Q4_K_S.gguf
      - PORT=5000
      - CTX_SIZE=2048
      - THREADS=4
      - TEMPERATURE=0.1
    deploy:
      resources:
        limits:
          memory: 4.5G
        reservations:
          memory: 3.8G
    healthcheck:
      test: ["CMD", "curl", "-sSf", "http://localhost:5000/health"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 600s
    restart: always

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  ollama_data:
    driver: local
  libretranslate_data:
    driver: local
  translator_model_cache:
    driver: local

networks:
  chorus-network:
    driver: bridge
  dokploy-network:
    external: true
