services:
  # PostgreSQL
  postgres:
    image: postgres:15-alpine
    container_name: chorus-postgres
    mem_limit: 512m
    environment:
      POSTGRES_DB: messenger_dev
      POSTGRES_USER: messenger
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U messenger -d messenger_dev"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis
  redis:
    image: redis:7-alpine
    container_name: chorus-redis
    mem_limit: 256m
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  # Go Backend API — stateless, horizontally scalable behind the L4 LB
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    mem_limit: 512m
    expose:
      - "8080"
    ports:
      - "127.0.0.1:8080:8080"
    env_file:
      - ./backend/.env
    environment:
      - SERVER_ID=${HOSTNAME:-backend}
      - ENVIRONMENT=development
      - DATABASE_URL=postgres://messenger:password@postgres:5432/messenger_dev?sslmode=disable
      - REDIS_URL=redis:6379
      - JWT_SECRET=${JWT_SECRET:-your-secret-key-change-in-production}
      - PORT=8080
      - PHOENIX_ENABLED=true
      - PHOENIX_OTLP_ENDPOINT=phoenix:4317
    volumes:
      - uploads_data:/root/uploads
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/health | grep -q healthy || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 15s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  # Layer 4 LB (TCP, leastconn) — mirrors prod; frontend proxies via this
  lb:
    image: haproxy:2.8-alpine
    volumes:
      - ./deploy/lb/haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro
    expose:
      - "8080"
      - "8404"
    ports:
      - "127.0.0.1:8404:8404"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

  # React Frontend — proxies /api,/ws through the LB (see nginx.conf)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: chorus-frontend
    mem_limit: 512m
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
    depends_on:
      lb:
        condition: service_started
    restart: unless-stopped

  # Ollama — offline LLM for grammar analysis / word-by-word breakdowns and
  # translation last-resort. CPU-only, no VRAM. The entrypoint pulls the model
  # on first boot, and the healthcheck only passes once that model is installed,
  # so the backend never starts before the local LLM is ready.
  # Model: qwen2.5:3b (~2 GB RAM) — keep in sync with MODEL_TRANSLATION_OLLAMA
  # in backend/.env. Proven for strict JSON/structured output and multilingual.
  ollama:
    image: ollama/ollama:latest
    container_name: chorus-ollama
    mem_limit: 4g
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    environment:
      - OLLAMA_NUM_PARALLEL=1
      - OLLAMA_MAX_LOADED_MODELS=1
      - OLLAMA_KEEP_ALIVE=-1
    entrypoint: >
      sh -c "ollama serve &
      sleep 3 &&
      ollama pull qwen2.5:3b &&
      wait"
    healthcheck:
      test: ["CMD", "ollama", "show", "qwen2.5:3b"]
      interval: 10s
      timeout: 10s
      retries: 60
      start_period: 30s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 4g
          cpus: '7'  # CPU-only local inference — allow most cores so qwen2.5:3b
                     # generates fast enough for chat-scale grammar analysis.
                     # Leave 1 core for the other services.

  # ============================================================================
  # LibreTranslate — fast local translation (Argos/OPUS-MT backend).
  # Near-real-time (~20-30ms warm) for chat-sized messages. First provider in
  # the translation chain. LT_LOAD_ONLY limits first-boot model downloads to
  # the top-10 world languages. mem_limit prevents a runaway model load from
  # exhausting the Docker Desktop/host VM and crashing other services.
  # Docs: https://github.com/LibreTranslate/LibreTranslate
  # ============================================================================
  libretranslate:
    image: libretranslate/libretranslate:latest
    container_name: chorus-libretranslate
    mem_limit: 2g
    ports:
      - "5000:5000"
    volumes:
      - libretranslate_data:/app/.local/share/argos-translate
    environment:
      # Top-10 world languages by speaker count:
      #   en English ~1.45B · zh Mandarin ~1.14B · hi Hindi ~609M
      #   es Spanish ~559M · ar Arabic ~332M · fr French ~312M
      #   bn Bengali ~278M · pt Portuguese ~264M · ru Russian ~255M
      #   ur Urdu
      # Extend this list as needed; each new pair downloads an Argos model once.
      - LT_LOAD_ONLY=en,zh,hi,es,ar,fr,bn,pt,ru,ur
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:5000/languages', timeout=5).status==200 else 1)"]
      interval: 20s
      timeout: 10s
      retries: 12
      start_period: 180s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 2g
          cpus: '1.0'

  # ============================================================================
  # Arize Phoenix — local OpenTelemetry backend for the FR-30/NFR-25 quality
  # pipeline. TranslationService + GrammarService export spans over OTLP gRPC
  # (port 4317); the web UI is at http://localhost:6006. Offline + realtime
  # evaluation of translation/grammar: traces, prompts, and evals are stored
  # here for KPI review (accuracy, p95 latency, cost/1k tokens, cache hits).
  # Not in the request hot path; the backend drops spans if Phoenix is down.
  # ============================================================================
  phoenix:
    image: arizephoenix/phoenix:latest
    container_name: chorus-phoenix
    mem_limit: 1g
    ports:
      - "6006:6006"   # Phoenix web UI
      - "4317:4317"   # OTLP gRPC (traces from backend)
      - "4318:4318"   # OTLP HTTP
    volumes:
      - phoenix_data:/phoenix
    environment:
      - PHOENIX_SQL_DATABASE_URL=sqlite:////phoenix/phoenix.db
    restart: unless-stopped

  # ============================================================================
  # Prometheus — NFR-18 metrics. Scrapes the backend /metrics (and the optional
  # DB/Redis exporters) on the Docker network. Grafana reads from this.
  # Web UI: http://localhost:9090
  # ============================================================================
  prometheus:
    image: prom/prometheus:v3.1.0
    container_name: chorus-prometheus
    mem_limit: 256m
    ports:
      - "9090:9090"
    volumes:
      - ./deploy/monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./deploy/monitoring/alerts-soak.yml:/etc/prometheus/alerts-soak.yml:ro
      - ./deploy/monitoring/alerts-word-mining.yml:/etc/prometheus/alerts-word-mining.yml:ro
      - ./deploy/monitoring/alerts-support.yml:/etc/prometheus/alerts-support.yml:ro
      - prometheus_data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=15d"
      - "--web.enable-lifecycle"
    depends_on:
      backend:
        condition: service_started
    restart: unless-stopped

  # PostgreSQL exporter (optional infra metrics for the Prometheus DB panel).
  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:v0.17.1
    container_name: chorus-postgres-exporter
    mem_limit: 128m
    environment:
      - DATA_SOURCE_URI=postgres:5432?sslmode=disable
      - DATA_SOURCE_USER=messenger
      - DATA_SOURCE_PASS=password
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  # Redis exporter (optional infra metrics for the Prometheus cache panel).
  redis-exporter:
    image: oliver006/redis_exporter:v1.65.0
    container_name: chorus-redis-exporter
    mem_limit: 128m
    environment:
      - REDIS_ADDR=redis://redis:6379
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  # ============================================================================
  # Grafana — NFR-18 dashboards for the above metrics. Auto-provisions the
  # Prometheus datasource and the Chorus backend dashboard. Login: admin/admin
  # (set GF_SECURITY_ADMIN_PASSWORD to change). Web UI: http://localhost:3001
  # ============================================================================
  grafana:
    image: grafana/grafana:11.2.0
    container_name: chorus-grafana
    mem_limit: 256m
    ports:
      - "3001:3000"   # host 3001 avoids clashing with the frontend (host 3000)
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-admin}
      - GF_USERS_ALLOW_SIGN_UP=false
      # Show the Chorus dashboard by default.
      - GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH=/var/lib/grafana/dashboards/chorus-backend.json
    volumes:
      - ./deploy/monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./deploy/monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  ollama_data:
  libretranslate_data:
  phoenix_data:
  prometheus_data:
  uploads_data:
  grafana_data: