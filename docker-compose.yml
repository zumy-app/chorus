services:
  # PostgreSQL
  postgres:
    image: postgres:15-alpine
    container_name: chorus-postgres
    mem_limit: 512m
    environment:
      POSTGRES_DB: messenger_dev
      POSTGRES_USER: messenger
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U messenger -d messenger_dev"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis
  redis:
    image: redis:7-alpine
    container_name: chorus-redis
    mem_limit: 256m
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  # Go Backend API
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: chorus-backend
    mem_limit: 512m
    ports:
      - "8080:8080"
    env_file:
      - ./backend/.env
    environment:
      - ENVIRONMENT=development
      - DATABASE_URL=postgres://messenger:password@postgres:5432/messenger_dev?sslmode=disable
      - REDIS_URL=redis:6379
      - JWT_SECRET=${JWT_SECRET:-your-secret-key-change-in-production}
      - PORT=8080
      - APPWRITE_ENDPOINT=${APPWRITE_ENDPOINT:-https://appwrite.zumy.app/v1}
      - APPWRITE_PROJECT_ID=${APPWRITE_PROJECT_ID:-6955733a001c10e7c020}
      - APPWRITE_API_KEY=${APPWRITE_API_KEY:-}
      - APPWRITE_DATABASE_ID=${APPWRITE_DATABASE_ID:-6955749200181b13d9d6}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  # React Frontend
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: chorus-frontend
    mem_limit: 512m
    ports:
      - "3000:3000"
    environment:
      - VITE_APPWRITE_ENDPOINT=${VITE_APPWRITE_ENDPOINT:-}
      - VITE_APPWRITE_PROJECT_ID=${VITE_APPWRITE_PROJECT_ID:-}
      - VITE_APPWRITE_DATABASE_ID=${VITE_APPWRITE_DATABASE_ID:-}
      - VITE_APPWRITE_CLIENT_API_KEY=${VITE_APPWRITE_CLIENT_API_KEY:-}
    depends_on:
      - backend
    restart: unless-stopped

  # Ollama — offline LLM for grammar analysis / word-by-word breakdowns and
  # translation last-resort. CPU-only, no VRAM. The entrypoint pulls the model
  # on first boot, and the healthcheck only passes once that model is installed,
  # so the backend never starts before the local LLM is ready.
  # Model: qwen2.5:3b (~2 GB RAM) — keep in sync with PROVIDER_OLLAMA_LOCAL_MODEL
  # in backend/.env. Proven for strict JSON/structured output and multilingual.
  ollama:
    image: ollama/ollama:latest
    container_name: chorus-ollama
    mem_limit: 4g
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    environment:
      - OLLAMA_NUM_PARALLEL=1
      - OLLAMA_MAX_LOADED_MODELS=1
      - OLLAMA_KEEP_ALIVE=-1
    entrypoint: >
      sh -c "ollama serve &
      sleep 3 &&
      ollama pull qwen2.5:3b &&
      wait"
    healthcheck:
      test: ["CMD", "ollama", "show", "qwen2.5:3b"]
      interval: 10s
      timeout: 10s
      retries: 60
      start_period: 30s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 4g
          cpus: '7'  # CPU-only local inference — allow most cores so qwen2.5:3b
                     # generates fast enough for chat-scale grammar analysis.
                     # Leave 1 core for the other services.

  # ============================================================================
  # LibreTranslate — fast local translation (Argos/OPUS-MT backend).
  # Near-real-time (~20-30ms warm) for chat-sized messages. First provider in
  # the translation chain. LT_LOAD_ONLY limits first-boot model downloads to
  # the top-10 world languages. mem_limit prevents a runaway model load from
  # exhausting the Docker Desktop/host VM and crashing other services.
  # Docs: https://github.com/LibreTranslate/LibreTranslate
  # ============================================================================
  libretranslate:
    image: libretranslate/libretranslate:latest
    container_name: chorus-libretranslate
    mem_limit: 2g
    ports:
      - "5000:5000"
    volumes:
      - libretranslate_data:/app/.local/share/argos-translate
    environment:
      # Top-10 world languages by speaker count:
      #   en English ~1.45B · zh Mandarin ~1.14B · hi Hindi ~609M
      #   es Spanish ~559M · ar Arabic ~332M · fr French ~312M
      #   bn Bengali ~278M · pt Portuguese ~264M · ru Russian ~255M
      #   ur Urdu
      # Extend this list as needed; each new pair downloads an Argos model once.
      - LT_LOAD_ONLY=en,zh,hi,es,ar,fr,bn,pt,ru,ur
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:5000/languages"]
      interval: 20s
      timeout: 10s
      retries: 12
      start_period: 180s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 2g
          cpus: '1.0'

volumes:
  postgres_data:
  redis_data:
  ollama_data:
  libretranslate_data: