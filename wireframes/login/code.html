<style>
        body {
            -webkit-tap-highlight-color: transparent;
        }
        .bg-pattern {
            background-image: radial-gradient(circle at 50% 0%, rgba(37, 99, 235, 0.08) 0%, transparent 60%);
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }

<body class="bg-surface text-on-surface min-h-screen flex flex-col font-body-md antialiased overflow-x-hidden relative">
<!-- Ambient Background Pattern -->
<div class="absolute inset-0 bg-pattern pointer-events-none -z-10"></div>
<!-- Main Content Canvas -->
<main class="flex-grow flex flex-col px-margin-mobile pt-12 pb-8 w-full max-w-md mx-auto relative z-10 justify-center min-h-screen">
<!-- Brand Header -->
<header class="flex flex-col items-center justify-center mb-10">
<div class="w-16 h-16 bg-primary-container rounded-2xl flex items-center justify-center mb-6 shadow-[0px_8px_24px_rgba(37,99,235,0.2)] rotate-[-10deg] hover:rotate-0 transition-transform duration-300">
<span class="material-symbols-outlined text-on-primary-container text-4xl" style="font-variation-settings: 'FILL' 1;">forum</span>
</div>
<h1 class="font-headline-lg text-headline-lg text-primary text-center mb-2">Chorus</h1>
<p class="font-body-md text-body-md text-on-surface-variant text-center px-4">Master new languages through seamless, conversational learning.</p>
</header>
<!-- Login Form Container -->
<div class="bg-surface-container-lowest rounded-3xl p-6 shadow-[0px_4px_12px_rgba(0,0,0,0.05)] border border-outline-variant/30 flex-grow-0">
<form class="flex flex-col gap-5">
<!-- Email Field -->
<div class="flex flex-col gap-1.5">
<label class="font-label-sm text-label-sm text-on-surface-variant ml-1" for="email">Email Address</label>
<div class="relative flex items-center">
<span class="material-symbols-outlined absolute left-3.5 text-outline pointer-events-none">mail</span>
<input class="w-full bg-surface text-on-surface pl-10 pr-4 py-3.5 rounded-xl border-none focus:ring-2 focus:ring-primary-container focus:bg-surface-container-lowest transition-colors placeholder:text-outline-variant font-body-md text-body-md shadow-sm" id="email" placeholder="you@example.com" required="" type="email"/>
</div>
</div>
<!-- Password Field -->
<div class="flex flex-col gap-1.5">
<div class="flex justify-between items-end ml-1">
<label class="font-label-sm text-label-sm text-on-surface-variant" for="password">Password</label>
<a class="font-label-sm text-label-sm text-primary hover:text-primary-container transition-colors" href="#">Forgot password?</a>
</div>
<div class="relative flex items-center">
<span class="material-symbols-outlined absolute left-3.5 text-outline pointer-events-none">lock</span>
<input class="w-full bg-surface text-on-surface pl-10 pr-12 py-3.5 rounded-xl border-none focus:ring-2 focus:ring-primary-container focus:bg-surface-container-lowest transition-colors placeholder:text-outline-variant font-body-md text-body-md shadow-sm" id="password" placeholder="••••••••" required="" type="password"/>
<button aria-label="Toggle password visibility" class="absolute right-3.5 text-outline hover:text-on-surface transition-colors" type="button">
<span class="material-symbols-outlined">visibility_off</span>
</button>
</div>
</div>
<!-- Primary Action Button -->
<button class="mt-2 w-full bg-primary-container text-on-primary-container font-label-md text-label-md py-4 rounded-xl flex items-center justify-center gap-2 hover:bg-primary transition-colors active:scale-[0.98] duration-150 shadow-md" type="submit">
<span>Log In</span>
<span class="material-symbols-outlined text-[18px]">arrow_forward</span>
</button>
</form>
<!-- Divider -->
<div class="flex items-center gap-4 my-6">
<div class="h-px bg-outline-variant/50 flex-grow"></div>
<span class="font-label-sm text-label-sm text-outline">OR CONTINUE WITH</span>
<div class="h-px bg-outline-variant/50 flex-grow"></div>
</div>
<!-- Social Logins -->
<div class="flex flex-col gap-3">
<button class="w-full bg-surface border border-outline-variant/50 text-on-surface font-label-md text-label-md py-3.5 rounded-xl flex items-center justify-center gap-3 hover:bg-surface-container-low transition-colors active:scale-[0.98] duration-150 shadow-sm">
<!-- Google SVG Icon Placeholder -->
<svg class="w-5 h-5" fill="none" viewbox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
<path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"></path>
<path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"></path>
<path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"></path>
<path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"></path>
</svg>
<span>Google</span>
</button>
<button class="w-full bg-inverse-surface text-inverse-on-surface font-label-md text-label-md py-3.5 rounded-xl flex items-center justify-center gap-3 hover:bg-on-surface transition-colors active:scale-[0.98] duration-150 shadow-sm">
<span class="material-symbols-outlined text-[20px]" style="font-variation-settings: 'FILL' 1;">file_download</span>
<span>Apple</span>
</button>
</div>
</div>
<!-- Bottom Link -->
<div class="mt-8 text-center flex flex-col items-center gap-2">
<p class="font-body-sm text-body-sm text-on-surface-variant">New here?</p>
<a class="font-label-md text-label-md text-primary hover:text-primary-container px-4 py-2 rounded-full hover:bg-primary-container/10 transition-colors" href="#">Create an account</a>
</div>
</main>
</body></html>
