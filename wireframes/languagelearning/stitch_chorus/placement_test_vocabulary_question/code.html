<body class="min-h-screen flex flex-col font-body-md overflow-x-hidden">

</button>
<!-- Progress Bar (Injected into Header for flow) -->
<div class="flex-1 max-w-xs mx-4">
<div class="h-2 w-full bg-surface-variant rounded-full overflow-hidden">
<div class="h-full bg-tertiary-container rounded-full transition-all duration-500 ease-out" style="width: 25%;"></div>

</div>

<main class="flex-1 flex flex-col w-full max-w-screen-sm mx-auto px-margin-mobile pt-stack-lg pb-32">

<h1 class="font-headline-lg text-headline-lg text-on-surface mb-2">Translate this phrase</h1>

<!-- Bottom Action Area -->
<div class="fixed bottom-0 left-0 w-full bg-background border-t border-surface-variant p-4 md:p-6 z-40">
<div class="max-w-screen-sm mx-auto w-full">
<button class="w-full bg-surface-container border border-outline-variant text-on-surface-variant font-headline-sm text-headline-sm py-4 rounded-xl opacity-70 cursor-not-allowed transition-all duration-200" disabled="" id="checkButton">
                Check
            </button>
</div>
</div>
<!-- Note: Suppressed BottomNavBar as this is a linear transactional/onboarding flow -->
<script>
        document.addEventListener('DOMContentLoaded', () => {
            const radioInputs = document.querySelectorAll('.option-input');
            const checkButton = document.getElementById('checkButton');

            radioInputs.forEach(input => {
                input.addEventListener('change', () => {
                    // Enable button when an option is selected
                    if (document.querySelector('.option-input:checked')) {
                        checkButton.disabled = false;
                        checkButton.classList.remove('bg-surface-container', 'border-outline-variant', 'text-on-surface-variant', 'opacity-70', 'cursor-not-allowed');
                        checkButton.classList.add('bg-primary', 'text-on-primary', 'hover:bg-primary-fixed-variant', 'active:scale-95', 'shadow-md');
                    }
                });
            });
        });
    </script>
