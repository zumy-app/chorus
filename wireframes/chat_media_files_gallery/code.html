<script>
        function switchTab(tabId) {
            // Hide all contents
            document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
            // Reset all buttons styling
            const buttons = ['media', 'docs', 'links'];
            buttons.forEach(id => {
                const btn = document.getElementById('tab-btn-' + id);
                btn.classList.remove('bg-white', 'shadow-sm', 'text-primary');
                btn.classList.add('text-on-surface-variant', 'hover:bg-white/50');
            });

            // Show selected content
            document.getElementById('tab-content-' + tabId).classList.add('active');
            
            // Style selected button
            const activeBtn = document.getElementById('tab-btn-' + tabId);
            activeBtn.classList.add('bg-white', 'shadow-sm', 'text-primary');
            activeBtn.classList.remove('text-on-surface-variant', 'hover:bg-white/50');
        }
    </script>
