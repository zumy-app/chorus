<script>
        // Simple interactive script for the multiple choice options
        document.addEventListener('DOMContentLoaded', () => {
            const options = document.querySelectorAll('main button');
            const checkBtn = document.querySelector('footer button:last-child');
            
            options.forEach(option => {
                option.addEventListener('click', function() {
                    // Reset all
                    options.forEach(opt => {
                        opt.classList.remove('border-primary', 'bg-surface-container-low');
                        opt.classList.add('border-outline-variant', 'bg-surface-container-lowest');
                        const circle = opt.querySelector('div');
                        circle.classList.remove('border-primary', 'bg-primary');
                        circle.classList.add('border-outline-variant');
                        circle.innerHTML = '';
                    });
                    
                    // Select clicked
                    this.classList.remove('border-outline-variant', 'bg-surface-container-lowest');
                    this.classList.add('border-primary', 'bg-surface-container-low');
                    
                    const circle = this.querySelector('div');
                    circle.classList.remove('border-outline-variant');
                    circle.classList.add('border-primary', 'bg-primary');
                    circle.innerHTML = '<span class="material-symbols-outlined text-on-primary text-[14px]" style="font-variation-settings: \'FILL\' 1;">check</span>';
                });
            });
        });
    </script>
