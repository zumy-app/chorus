worker_processes auto;
events { worker_connections 4096; }
stream {
    upstream chorus_backend {
        least_conn;
        server backend:8080 max_conns=1000 max_fails=3 fail_timeout=5s;
    }
    server {
        listen 8080;
        proxy_pass chorus_backend;
        proxy_connect_timeout 5s;
        proxy_timeout 86400s;
        health_check interval=5s passes=2 fails=3;
    }
}
