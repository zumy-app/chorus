# Grafana dashboard provisioning (NFR-18/25).
# Loads the Chorus backend dashboard from /etc/grafana/provisioning/dashboards.
apiVersion: 1

providers:
  - name: Chorus
    folder: Chorus
    type: file
    disableDeletion: true
    updateIntervalSeconds: 30
    allowUiUpdates: true
    options:
      path: /var/lib/grafana/dashboards
      foldersFromFilesStructure: false
